<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" aria-hidden="true">
  <!-- Motif bintang delapan & oktagon (khatam) garis tipis emas, seamless -->
  <g fill="none" stroke="#e9cf7a" stroke-width="1.2" stroke-linejoin="round">
    <!-- bintang delapan di tengah: dua persegi saling silang -->
    <path d="M38 38h52v52H38z"/>
    <path d="M64 27.2 100.8 64 64 100.8 27.2 64z"/>
    <!-- oktagon pengeliling -->
    <path d="M45 18h38l27 27v38l-27 27H45L18 83V45z"/>
    <!-- bintang delapan di sudut tile (bergabung 4 tile jadi satu bintang) -->
    <path d="M0 0h18v18H0zM0 0l25.5 0M0 0l0 25.5"/>
    <path d="M128 0h-18v18h18zM128 0l-25.5 0M128 0l0 25.5"/>
    <path d="M0 128h18v-18H0zM0 128l25.5 0M0 128l0-25.5"/>
    <path d="M128 128h-18v-18h18zM128 128l-25.5 0M128 128l0-25.5"/>
    <!-- belah ketupat di tengah sisi (membentuk silang antar tile) -->
    <path d="M64 0l10 10-10 10-10-10z"/>
    <path d="M64 128l10-10-10-10-10 10z"/>
    <path d="M0 64l10 10 10-10-10-10z"/>
    <path d="M128 64l-10 10-10-10 10-10z"/>
    <!-- penghubung oktagon ke sudut -->
    <path d="M18 45 0 27M110 45l18-18M18 83 0 101M110 83l18 18"/>
  </g>
</svg>
